symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: dark-lunar-messages
setupVersion: 2
tools:
  approvalMode: yolo
statusLine:
  preset: custom
  leftSegments:
    - model
    - status
  rightSegments: []
  contextLine: "off"
  sessionAccent: false
  transparent: true
  compactThinkingLevel: false
  showHookStatus: false
startup:
  quiet: true
  checkUpdate: false
  changelogMode: hidden
loop:
  mode: fullscreen
  quiet: true
web_search:
  enabled: true
modelRoles:
  default: openai-codex/gpt-6.1-sol:medium
  smol: "@default:low"
  slow: "@default:high"
  plan: "@slow"
  task: "@default"
  review: "@slow"
colorBlindMode: false
terminal:
  showProgress: false
tui:
  textSizing: false
  renderMermaid: true
  reactions: true
  titleState: true
  hyperlinks: always
  tight: true
display:
  shimmer: classic
  pinnedAgents: full
  hideToolActivity: false
  cacheMissMarker: false
images:
  blockImages: true
defaultThinkingLevel: medium
hideThinkingBlock: false
personality: pragmatic
edit:
  mode: hashline
bash:
  enabled: true
  allowCompoundCommands: true
task:
  disabledAgents:
    - agent-creator-demo
  agentModelOverrides:
    scout: "@smol"
    sonic: "@smol"
    task: "@task"
    reviewer: "@review"
    security-reviewer: "@review"
dev:
  autoqaConsent: granted