symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: dark-lunar-messages
setupVersion: 3
tools:
  approvalMode: yolo
statusLine:
  preset: custom
  leftSegments:
    - model
    - status
  rightSegments:
    - usage
  contextLine: "off"
  sessionAccent: false
  transparent: true
  compactThinkingLevel: false
  showHookStatus: false
startup:
  quiet: true
  checkUpdate: false
  changelogMode: hidden
loop:
  mode: fullscreen
  quiet: true
web_search:
  enabled: true
modelRoles:
  default: openai-codex/gpt-6-astra:medium
  smol: openai-codex/gpt-6.1-sol:low
  slow: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:high
  task: openai-codex/gpt-6.1-sol:medium
  review: openai-codex/gpt-6-astra:high
colorBlindMode: false
terminal:
  showProgress: false
tui:
  textSizing: false
  renderMermaid: true
  reactions: true
  titleState: true
  hyperlinks: always
  tight: true
display:
  shimmer: classic
  pinnedAgents: full
  hideToolActivity: false
  cacheMissMarker: false
images:
  blockImages: true
defaultThinkingLevel: medium
hideThinkingBlock: true
personality: pragmatic
edit:
  mode: hashline
bash:
  enabled: true
  allowCompoundCommands: true
task:
  disabledAgents:
    - agent-creator-demo
  perCallModel: "on"
dev:
  autoqaConsent: granted
memory:
  backend: mnemopi