[git]
./git/gitconfig:$HOME/.gitconfig
./git/gitignore_global:$HOME/.gitignore_global

[gdb]
./gdb/home.gdbinit:$HOME/.gdbinit

[herdr]
./herdr/config.toml:$HOME/.config/herdr/config.toml

[tmux]
